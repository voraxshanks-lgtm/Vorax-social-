
<script type="module">
import { createClient } from
  "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL =
  "https://aeospscyiadfpwnwhmas.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_7eEsZphY2FRKjU1SyRWmpA_UcEhRKfL";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const message = document.getElementById("message");

document.getElementById("signup").addEventListener("click", async () => {
  const username = document.getElementById("username").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!username || !email || password.length < 6) {
    message.textContent =
      "Entre un pseudo, un e-mail et un mot de passe de 6 caractères minimum.";
    return;
  }

  const { error } = await supabase.auth.signUp({
    email,
    password,
    options: { data: { username } }
  });

  message.textContent = error
    ? "Erreur : " + error.message
    : "Inscription envoyée ! Vérifie ton e-mail si nécessaire.";
});

document.getElementById("login").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { error } = await supabase.auth.signInWithPassword({
    email,
    password
  });

  message.textContent = error
    ? "Erreur : " + error.message
    : "Connexion réussie !";

  if (!error) await afficherSolde();
});

async function afficherSolde() {
  const { data: { user } } = await supabase.auth.getUser();

  if (!user) return;

  const { data, error } = await supabase
    .from("vc_wallets")
    .select("balance")
    .eq("user_id", user.id)
    .maybeSingle();

  if (error) {
    message.textContent = "Impossible de lire le solde.";
    return;
  }

  document.getElementById("balance").textContent =
    data ? data.balance : "0";
}

afficherSolde();
</script>
</body>
</html>
